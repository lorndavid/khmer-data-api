services:
  # 1. PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: khmerapi-database-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-khmerapi}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-khmerapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M

  # 2. Node.js Express REST API
  backend:
    image: ${DOCKER_IMAGE_API:-khmerapi/backend:latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: khmerapi-backend-prod
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./data/uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@database:5432/khmerapi?schema=public}
      REDIS_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_khmerapi_platform_default}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_jwt_key_khmerapi_platform_default}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      database:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1024M

  # 3. Vue 3 Frontend & Nginx
  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-khmerapi/frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://khmerapi.lorndavid.online/api/v1}
    container_name: khmerapi-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # 4. Cloudflare Tunnel (Zero Public IP needed)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: khmerapi-tunnel-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    profiles:
      - tunnel
    depends_on:
      - backend


